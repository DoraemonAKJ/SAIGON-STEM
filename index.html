<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giao diện Đăng nhập</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Tuỳ chỉnh font chữ để cứng cáp và hiện đại */
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap');
    body { font-family: 'Montserrat', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-transparent flex items-center justify-center p-8">

  <div class="w-full max-w-[900px] h-[550px] border border-gray-300 bg-[url('image/DN.png')] bg-cover bg-center bg-no-repeat rounded-3xl shadow-2xl flex overflow-hidden relative">

    <div class="w-[45%] h-full relative flex flex-col justify-center">
      </div>

    <div class="w-[55%] h-full bg-white rounded-l-[4rem] p-12 flex flex-col justify-center relative z-20 shadow-[-20px_0_60px_rgba(0,0,0,0.4)] border-l border-gray-100">
      
      <div class="flex justify-center mt-2 mb-12">
        <img 
          src="image/SAIGON.png" 
          alt="Logo SAIGON STEM" 
          class="w-32 h-auto object-contain"
        >
      </div>

      <form class="space-y-8" onsubmit="xuLyDangNhap(event)">
        
        <div class="relative flex items-center border-b-2 border-gray-300 pb-2 focus-within:border-[#6B5AED] transition-colors">
          <svg class="w-5 h-5 text-gray-700 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <input type="text" placeholder="Tài Khoản" class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-500 text-sm font-semibold">
        </div>

        <div class="relative flex items-center border-b-2 border-gray-300 pb-2 focus-within:border-[#6B5AED] transition-colors">
          <svg class="w-5 h-5 text-gray-700 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input type="password" placeholder="Password" class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-500 text-sm font-semibold">
        </div>

        <div class="flex items-center justify-between pt-4">
          <a href="#" class="text-gray-500 hover:text-gray-800 text-xs font-bold hover:underline transition-colors">Cập nhật</a>
          
          <button type="submit" class="bg-[#6B5AED] text-white text-xs font-bold px-8 py-3 rounded-full transform hover:-translate-y-1 hover:bg-[#5746E5] shadow-lg shadow-[#6B5AED]/40 hover:shadow-2xl hover:shadow-[#6B5AED]/60 transition-all duration-300 tracking-wider">
            LOGIN
          </button>
        </div>
      </form>

    </div>
  </div>
<script>
    function xuLyDangNhap(event) {
      event.preventDefault(); // Ngăn form tải lại trang
      
      // Chuyển hướng sang trang chủ sau khi bấm đăng nhập
      window.location.href = 'trangchu.html'; 
    }
  </script>
</body>
</html>
</body>
</html>
